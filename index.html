<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кемерово: от индустриализации к современности</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=4f9d3c26-2567-4016-bf13-0bc37eee8ec0&lang=ru_RU&modules=multiRouter.MultiRoute" type="text/javascript"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-size: 14px;
            z-index: 1000;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .legend-blue { background: #1e98ff; }
        .legend-red { background: #ff0000; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot legend-blue"></div>
            <span>Как всё начиналось</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot legend-red"></div>
            <span>Чем город стал</span>
        </div>
    </div>

    <script type="text/javascript">
        ymaps.ready(init);

        function init() {
            var myMap = new ymaps.Map("map", {
                center: [55.355, 86.100],
                zoom: 11,
                controls: ['zoomControl', 'fullscreenControl']
            });

            // Координаты маршрута 1
            var route1Points = [
                [55.375501, 86.071729],
                [55.374084, 86.078472],
                [55.34812, 86.075774]
            ];

            // Координаты маршрута 2
            var route2Points = [
                [55.351324, 86.100151],
                [55.346332, 86.096641],
                [55.358386, 86.127048],
                [55.35984, 86.152002],
                [55.336875, 86.166281],
                [55.337337, 86.168192],
                [55.337739, 86.161727],
                [55.337570, 86.160157]
            ];

            // Данные для балунов
            var route1 = [
                { coords: route1Points[0], name: "Красная Горка", img: "krasnaya-gorka.jpg" },
                { coords: route1Points[1], name: "Памятник «Память шахтёрам Кузбасса»", img: "pamyat-shahtyoram.jpg" },
                { coords: route1Points[2], name: "Площадь Волкова", img: "ploshchad-volkova.jpg" }
            ];

            var route2 = [
                { coords: route2Points[0], name: "Сибирский кластер искусств", img: "klaster-muzey.jpg" },
                { coords: route2Points[1], name: "Памятник Александру Невскому", img: "nevskiy.jpg" },
                { coords: route2Points[2], name: "Московская площадь", img: "moskovskaya-ploshchad.jpg" },
                { coords: route2Points[3], name: "Мемориал Воину-Освободителю", img: "masalov.jpg" },
                { coords: route2Points[4], name: "Академия хореографии", img: "horeografiya.jpg" },
                { coords: route2Points[5], name: "Центральная музыкальная школа", img: "muz-shkola.jpg" },
                { coords: route2Points[6], name: "Кампус РГИСИ", img: "rgisi.jpg" },
                { coords: route2Points[7], name: "Фондохранилище", img: "fondohranilishche.jpg" }
            ];

            // Функция добавления меток
            function addPoints(points, color) {
                points.forEach(function(point) {
                    var balloonHtml = '<b>' + point.name + '</b>';
                    
                    if (point.img) {
                        balloonHtml += '<br><img src="' + point.img + '" style="width:100%; max-width:250px; margin-top:8px; border-radius:8px;">';
                    }

                    var placemark = new ymaps.Placemark(point.coords, {
                        hintContent: point.name,
                        balloonContent: balloonHtml
                    }, {
                        preset: 'islands#' + color + 'Icon'
                    });
                    myMap.geoObjects.add(placemark);
                });
            }

            // Добавляем метки
            addPoints(route1, 'blue');
            addPoints(route2, 'red');

            // ЛИНИЯ МАРШРУТА 1 (синяя)
            var multiRoute1 = new ymaps.multiRouter.MultiRoute({
                referencePoints: route1Points,
                params: {
                    routingMode: 'pedestrian'
                }
            }, {
                boundsAutoApply: false,
                wayPointVisible: false,
                routeActiveStrokeWidth: 5,
                routeActiveStrokeColor: '#1e98ff'
            });
            myMap.geoObjects.add(multiRoute1);

            // ЛИНИЯ МАРШРУТА 2 (красная)
            var multiRoute2 = new ymaps.multiRouter.MultiRoute({
                referencePoints: route2Points,
                params: {
                    routingMode: 'pedestrian'
                }
            }, {
                boundsAutoApply: false,
                wayPointVisible: false,
                routeActiveStrokeWidth: 5,
                routeActiveStrokeColor: '#ff0000'
            });
            myMap.geoObjects.add(multiRoute2);
        }
    </script>
</body>
</html>
